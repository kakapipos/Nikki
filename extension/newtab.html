<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>New Tab</title>
<link rel="stylesheet" href="newtab.css">
</head>
<body>
<main id="stage">
  <img id="feature" alt="Featured image">
  <div id="controls">
    <button id="fullscreen" type="button">Enter fullscreen</button>
    <button id="hide" type="button">Hide image</button>
    <a href="options.html">Settings</a>
  </div>
  <div id="hidden" hidden>
    <p>Image hidden.</p>
    <button id="show" type="button">Show image</button>
    <a href="options.html">Settings</a>
  </div>
  <p id="error" hidden>Image could not be loaded. Check the image URL in Settings.</p>
</main>
<script src="newtab.js"></script>
</body>
</html>
