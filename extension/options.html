<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nikki New Tab Settings</title>
<style>
body{max-width:560px;margin:32px auto;padding:0 16px;background:#111;color:#eee;font:16px system-ui}
label{display:block;margin:20px 0 6px}input{box-sizing:border-box;width:100%;padding:9px;background:#222;color:white;border:1px solid #777;border-radius:4px;font:inherit}
button{margin:18px 8px 0 0;padding:9px 14px;background:#333;color:white;border:1px solid #888;border-radius:4px;font:inherit;cursor:pointer}#status{min-height:1.5em}
</style>
</head>
<body>
<h1>Nikki New Tab</h1>
<label for="chance">Chance the image appears (0–100%)</label>
<input id="chance" type="number" min="0" max="100" step="1" value="50">
<label for="imageUrl">Image URL</label>
<input id="imageUrl" type="url" spellcheck="false">
<label for="fallbackUrl">Page to open when the image does not appear</label>
<input id="fallbackUrl" type="url" spellcheck="false" placeholder="https://www.google.com/">
<button id="save" type="button">Save</button><button id="reset" type="button">Reset defaults</button>
<p id="status" role="status" aria-live="polite"></p>
<p>Edge extensions cannot restore the built-in edge://newtab page after replacing it. Set the fallback to the website you normally use as your start page.</p>
<script src="options.js"></script>
</body>
</html>
